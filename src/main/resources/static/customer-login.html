<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - DriveEase Vehicle Rental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-nav">
    <a href="index.html" class="brand-wrapper">
      <div class="brand-icon-box">
        <i class="fa-solid fa-car-rear"></i>
      </div>
      <div class="brand-text">
        <h1>DriveEase</h1>
        <p>Customer Access Portal</p>
      </div>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-house"></i> Home</a>
      <a href="manager-login.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-clipboard-check"></i> Manager Login</a>
      <a href="admin-login.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-user-gear"></i> Admin Login</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-portal-icon customer">
          <i class="fa-solid fa-user-circle"></i>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem;">Customer Portal Login</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Sign in to browse vehicles, manage reservations & pay</p>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div class="demo-credentials-box">
        <div>
          <span>Demo Account:</span><br>
          <code>john_doe</code> / <code>user123</code>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickFillCustomer()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Fill
        </button>
      </div>

      <!-- Sign In Form -->
      <form id="customerLoginForm" onsubmit="handleCustomerLogin(event)">
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Username</label>
          <input type="text" id="custUsername" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="custPassword" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; background: linear-gradient(135deg, #0284c7, #06b6d4);">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Customer Dashboard
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-glass); padding-top: 1.25rem;">
        <span style="color: var(--text-muted); font-size: 0.88rem;">New to DriveEase?</span>
        <button type="button" class="btn btn-secondary btn-sm" style="margin-left: 0.5rem;" onclick="openRegisterModal()">
          <i class="fa-solid fa-user-plus"></i> Register New Customer
        </button>
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="closeRegisterModal()"><i class="fa-solid fa-xmark"></i></button>
      <div style="margin-bottom: 1.25rem;">
        <h3 style="font-size: 1.3rem; font-weight: 700; color: #38bdf8;"><i class="fa-solid fa-id-card"></i> Customer Registration</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Per SRS FR3: Registration with valid driving licence information</p>
      </div>

      <form onsubmit="handleCustomerRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Robert Smith" required>
          </div>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUsername" class="form-control" placeholder="e.g. robert_s" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Create strong password" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="e.g. +1 555-0199" required>
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" id="regAddress" class="form-control" placeholder="e.g. 123 Pine St, Seattle, WA" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Driving Licence Number (Unique)</label>
            <input type="text" id="regLicence" class="form-control" placeholder="e.g. DL-WA-2024-8891" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="e.g. robert@example.com">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">Cancel</button>
          <button type="submit" class="btn btn-success"><i class="fa-solid fa-check"></i> Register & Enter Dashboard</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastBox"></div>

  <script src="js/api.js"></script>
  <script>
    function quickFillCustomer() {
      document.getElementById('custUsername').value = 'john_doe';
      document.getElementById('custPassword').value = 'user123';
      showToast('Filled John Doe credentials', 'info');
    }

    async function handleCustomerLogin(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('loginSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const username = document.getElementById('custUsername').value;
      const password = document.getElementById('custPassword').value;

      try {
        const res = await apiPost('/auth/login', {
          username: username,
          password: password,
          requiredRole: 'CUSTOMER'
        });

        if (res.success) {
          setCurrentUser(res);
          showToast('Welcome back, ' + (res.fullName || res.username), 'success');
          setTimeout(() => {
            window.location.href = 'customer-dashboard.html';
          }, 600);
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Customer Dashboard';
      }
    }

    function openRegisterModal() {
      document.getElementById('registerModal').classList.add('active');
    }

    function closeRegisterModal() {
      document.getElementById('registerModal').classList.remove('active');
    }

    async function handleCustomerRegister(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('regName').value,
        username: document.getElementById('regUsername').value,
        password: document.getElementById('regPassword').value,
        phone: document.getElementById('regPhone').value,
        address: document.getElementById('regAddress').value,
        drivingLicence: document.getElementById('regLicence').value,
        email: document.getElementById('regEmail').value
      };

      try {
        const res = await apiPost('/auth/register-customer', payload);
        if (res.success) {
          setCurrentUser(res);
          showToast('Registration successful! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'customer-dashboard.html';
          }, 800);
        }
      } catch (err) {
        // Handled in apiPost toast
      }
    }
  </script>
</body>
</html>
